<body class="min-h-screen bg-gray-50">

    <div class="min-h-screen flex">
        
        <div class="hidden lg:block lg:w-5/12 relative">
            <img alt="Sản phẩm cho bé" class="absolute inset-0 w-full h-full object-cover">
        </div>

        
        <div class="w-full lg:w-7/12 flex items-center justify-center p-6 sm:p-10 bg-white">

                <div class="mb-6 anim-up">
                    <a href="#" class="inline-flex items-center gap-3 group">

                            <i class="fas fa-moon text-white text-base"></i>
                        </div>
                        <div>
                            <span class="text-xl font-black text-gray-800 tracking-tight block leading-none">TECHCARE</span>
                            <span class="text-[9px] text-gray-400 uppercase tracking-[0.2em]">Tiện ích thông minh</span>
                        </div>
                    </a>
                </div>

                
                <div class="mb-6 anim-up-2">
                    <h1 class="text-2xl font-bold text-gray-800">Tạo tài khoản mới</h1>
                    <p class="text-sm text-gray-400 mt-1.5">Đăng ký để mua sắm và theo dõi đơn hàng</p>

                <a href="#" class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-gray-700 font-semibold text-sm hover:bg-gray-100 hover:border-gray-300 transition shadow-sm anim-up-2">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                    </svg>
                    Đăng ký bằng Google
                </a>

                <div class="relative my-5">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                    <div class="relative flex justify-center"><span class="px-3 text-xs text-gray-400 bg-white">hoặc đăng ký bằng email</span></div>
                </div>

                <form method="POST" action="#" class="space-y-3.5 anim-up-3" id="registerForm">
                    <input type="hidden" name="_token" value="CPZqIV5ifRjAyWLqcO5fMElJl8ogWgRv5Z8ejY8z" autocomplete="off">
                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-user text-sm"></i></div>
                        <input type="text" name="name" value="" required="" placeholder="Họ và tên" class="input-field w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm placeholder-gray-400 focus:bg-white outline-none">
                    </div>

                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-envelope text-sm"></i></div>
                        <input type="email" name="email" value="" required="" placeholder="Email" class="input-field w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm placeholder-gray-400 focus:bg-white outline-none">
                    </div>

                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-phone text-sm"></i></div>
                        <input type="tel" name="phone" value="" placeholder="Số điện thoại (tùy chọn)" class="input-field w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm placeholder-gray-400 focus:bg-white outline-none">
                    </div>

                    <div>
                        <div class="relative">

                            <input id="password" type="password" name="password" required="" placeholder="Mật khẩu" oninput="checkStrength(this.value)" class="input-field w-full pl-11 pr-12 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm placeholder-gray-400 focus:bg-white outline-none">
                            <button type="button" onclick="togglePassword(&#x27;password&#x27;, this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">
                                <i class="far fa-eye text-sm"></i>
                            </button>
                        </div>
                        <div class="mt-1.5 flex items-center gap-2">
                            <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                <div id="strengthBar" class="strength-bar h-full rounded-full w-0 bg-red-400"></div>
                            </div>
                            <span id="strengthText" class="text-[10px] text-gray-400 min-w-[60px] text-right"></span>
                        </div>
                        <p class="text-[10px] text-gray-400 mt-0.5"><i class="fas fa-info-circle mr-0.5 text-orange-300"></i> Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và số</p>

                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-lock text-sm"></i></div>
                        <input id="password_confirmation" type="password" name="password_confirmation" required="" placeholder="Xác nhận mật khẩu" class="input-field w-full pl-11 pr-12 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-sm placeholder-gray-400 focus:bg-white outline-none">
                        <button type="button" onclick="togglePassword(&#x27;password_confirmation&#x27;, this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">
                            <i class="far fa-eye text-sm"></i>
                        </button>
                    </div>

                    <label class="flex items-start gap-2.5 cursor-pointer group">
                        <input type="checkbox" name="terms" required="" class="w-4 h-4 rounded border-gray-300 text-[#e74c3c] focus:ring-[#e74c3c]/30 mt-0.5 cursor-pointer">

                    <button type="submit" id="registerBtn" class="w-full py-3.5 bg-gradient-to-r from-[#e74c3c] to-[#c0392b] hover:from-[#c0392b] hover:to-[#a93226] text-white font-bold text-sm rounded-xl transition-all duration-200 shadow-lg shadow-red-200/60 hover:shadow-red-300/80 flex items-center justify-center gap-2">
                        <i class="fas fa-user-plus"></i> Đăng ký
                    </button>
                </form>

                <p class="text-center text-sm text-gray-500 mt-5">
                    Đã có tài khoản?
                    <a href="../login/index.html" class="text-[#e74c3c] font-semibold hover:text-[#c0392b] transition ml-1">Đăng nhập</a>
